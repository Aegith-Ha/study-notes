name: study-py312
channels:
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.12

  # 기본 필수
  - pip
  - setuptools
  - wheel

  # 개발 편의
  - ipython
  - jupyterlab

  # (선택) 컴파일 필요할 때 대비
  - gcc  # linux only (WSL 포함)
  - gxx

  # pip 패키지
  - pip:
      # Web
      - fastapi
      - uvicorn[standard]

      # 설정
      - pydantic
      - pydantic-settings
      - email-validator
      - python-dotenv

      # DB
      - sqlalchemy

      # Milvus
      #- pymilvus==2.4.15

      # RAG / NLP
      - rank-bm25

      # Embedding (dense retrieval)
      # 모델: dragonkue/snowflake-arctic-embed-l-v2.0-ko (1024차원, 약 2.3GB, 첫 실행 시 자동 다운로드)
      # GPU가 없는 환경이므로 CPU 전용 torch를 설치한다. (CUDA 버전은 불필요한 라이브러리가 수 GB 추가됨)
      - --extra-index-url https://download.pytorch.org/whl/cpu
      - torch
      - sentence-transformers

      # 기타 유틸
      - requests
      - tqdm



# 명령어 
# conda env create -f environment.yml
